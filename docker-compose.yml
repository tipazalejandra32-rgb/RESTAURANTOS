services:
  mysql:
    image: mysql:8.0
    container_name: restaurantos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootchangeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurante-facturacion-si}
      MYSQL_USER: ${MYSQL_USER:-restaurant}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-appchangeme}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-rootchangeme}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurantos-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-restaurant}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-appchangeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurante-facturacion-si}
      AUTH_SECRET: ${AUTH_SECRET:-cambiar-en-produccion-minimo-32-caracteres}
    networks:
      - app-network

  ngrok:
    image: ngrok/ngrok:latest
    command: http app:3000 --url=diminish-battered-pushup.ngrok-free.dev
    environment:
      - NGROK_AUTHTOKEN=3EEhgAxcR5g0NwxJ93CSYZ0lPIB_gFWi1vLqti1UMmpH1paT
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: